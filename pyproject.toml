[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-glance"
version = "0.1.1"
description = "df.describe() for JSON and nested data - a human-readable shape summary in one call."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arun Brahma" }]
keywords = ["json", "schema", "inspect", "debug", "data", "cli", "describe", "summary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
json-glance = "json_glance._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/json_glance"]
